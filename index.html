        <h1>TYFMS — Thank You For My Service</h1>
        <p>Free tools to help veterans and service members navigate the military-to-civilian transition. Every tool is free — no subscriptions, no fees.</p>

        <h2>The Transition Gap Is Real</h2>
        <ul>
          <li><strong>200,000+</strong> veterans separate from service every year (U.S. Department of Veterans Affairs)</li>
          <li>It takes the average veteran <strong>6–12 months</strong> to find civilian employment after separation</li>
          <li>Veterans who plan their transition <strong>12+ months</strong> out are significantly more likely to find employment aligned with their skills</li>
        </ul>

        <h2>Frequently Asked Questions</h2>

        <h3>Is TYFMS really free?</h3>
        <p>Yes, completely free. No subscriptions, no hidden fees, no premium tiers. Every tool on this site — the Resume Builder, Skills Translator, Identity Guide, Document Vault, and everything else — is available to every veteran and service member at no cost. The site is supported by Google AdSense display ads.</p>

        <h3>Who is TYFMS for?</h3>
        <p>TYFMS is built for anyone navigating the military-to-civilian transition — active duty service members preparing to separate, veterans who have already transitioned and are still finding their footing, National Guard and Reserve members, and military spouses. If the uniform is part of your life, this site is for you.</p>

        <h3>How does the Resume Builder work?</h3>
        <p>You enter your military background, upload your service documents (OERs, NCOERs, award citations, DD-214, or Joint Service Transcript), and paste in a job description for the role you are targeting. The AI reads your actual service record and the official duty descriptions for your MOS from DA PAM 600-3 and DA PAM 600-25, then builds a resume tailored to that specific job. It scores your resume against the job description and tells you exactly what to improve before you apply.</p>

        <h3>What is the Joint Service Transcript and why does it matter?</h3>
        <p>The Joint Service Transcript (JST) is your official military education and training transcript. It documents every course you completed during your service and recommends college credit for them through the American Council on Education. Most veterans have never heard of it. You can get yours free at jst.doded.mil — it takes about 10 minutes. Upload it to your TYFMS Document Vault and the Resume Builder will use your actual training record to build your resume.</p>

        <h3>Is my personal information safe?</h3>
        <p>Yes. All data is stored in a SOC 2 compliant database with Row Level Security enabled — meaning only you can access your own data. Documents uploaded to the Document Vault are stored in a private storage bucket accessible only to your account. TYFMS does not sell, share, or monetize your personal information. The site does not require your Social Security Number.</p>

        <h3>What branches of service does TYFMS support?</h3>
        <p>TYFMS supports Army (officers and enlisted), Air Force (officers and enlisted), Navy, and Marine Corps. Coast Guard and Space Force support is coming soon. The MOS and rating lookup system uses official government publications including DA PAM 600-3, DA PAM 600-25, NAVPERS 18068F, and MCO 1200.17.</p>

        <h3>What is the Identity Guide?</h3>
        <p>The Identity Guide is a confidential AI conversation that helps you figure out who you are beyond your rank and MOS. Research shows that the hardest part of military transition isn't finding a job — it's the identity shift that happens when the structure and purpose of military life disappear. The Identity Guide helps you find the language to talk about yourself, your values, and your strengths in civilian terms.</p>

        <h3>How is TYFMS different from TAP?</h3>
        <p>TAP (Transition Assistance Program) is mandatory and time-limited — you go through it once before you separate. TYFMS is available to you before, during, and after your transition, as many times as you need it. TAP gives you information. TYFMS gives you tools you can use at any point in the process.</p>
